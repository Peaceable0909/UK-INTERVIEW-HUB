<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/UK-INTERVIEW-HUB/">
<title>Choose Your Course | York St John</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c41230;--red-dk:#9e0e25;--navy:#1a1a2e;
  --surface:#fff;--bg:#f0f2f5;--border:#e5e7eb;
  --txt:#111827;--muted:#6b7280;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
  background:var(--bg);-webkit-font-smoothing:antialiased;}
.mat{font-family:"Material Symbols Outlined";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:middle;line-height:1;}

/* Header */
.header{
  background:var(--navy);color:#fff;
  padding:48px 20px 24px;
  padding-top:calc(48px + env(safe-area-inset-top));
}
.header-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--red);
  display:flex;align-items:center;justify-content:center;}
.logo-mark .mat{font-size:20px;color:#fff;}
.logo-text{font-size:12px;font-weight:800;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.06em;}
.header h1{font-size:26px;font-weight:900;line-height:1.2;margin-bottom:6px;}
.header h1 em{color:#fca5a5;font-style:normal;}
.header p{font-size:14px;color:rgba(255,255,255,.65);line-height:1.5;}

/* User strip */
.user-strip{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
}
.user-info{display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--red),#7c3aed);
  color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;}
.user-name{font-size:14px;font-weight:700;color:var(--navy);}
.user-email{font-size:11px;color:var(--muted);}
.btn-dash{
  display:flex;align-items:center;gap:6px;
  background:var(--red);color:#fff;border:none;border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;
}

/* Search */
.search-wrap{padding:16px 20px 8px;background:var(--surface);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);}
.search-box{
  display:flex;align-items:center;gap:10px;
  background:var(--bg);border:1.5px solid var(--border);border-radius:12px;
  padding:0 14px;height:44px;
}
.search-box .mat{font-size:20px;color:var(--muted);}
.search-box input{flex:1;border:none;background:none;font-size:14px;outline:none;color:var(--txt);}

/* Category tabs */
.cat-scroll{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-btn{
  flex-shrink:0;padding:7px 14px;border-radius:99px;
  border:1.5px solid var(--border);background:var(--surface);
  font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.cat-btn.active,.cat-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}

/* Course list */
.course-list{padding:8px 20px 120px;}
.course-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:10px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:all .18s;-webkit-tap-highlight-color:transparent;
}
.course-card:hover,.course-card:active{border-color:var(--red);transform:scale(.99);}
.course-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.course-icon .mat{font-size:22px;}
.course-info{flex:1;min-width:0;}
.course-name{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:3px;}
.course-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.campus-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:#f3f4f6;border-radius:6px;padding:2px 8px;
  font-size:11px;font-weight:700;color:var(--muted);
}
.campus-badge.london{background:#eff6ff;color:#1d4ed8;}
.course-arrow .mat{font-size:18px;color:var(--muted);}

/* Bottom CTA */
.bottom-cta{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);border-top:1px solid var(--border);
  backdrop-filter:blur(20px);display:none;
}
.bottom-cta.show{display:block;}
.btn-select{
  width:100%;background:var(--red);color:#fff;border:none;
  border-radius:14px;padding:16px;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
}
.btn-select .mat{font-size:20px;}
.selected-name{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div class="logo-mark"><span class="mat fill">school</span></div>
    <span class="logo-text">York St John University</span>
  </div>
  <h1>Choose Your <em>Course</em></h1>
  <p>Select the course you are preparing for your Pre-CAS credibility interview.</p>
</div>

<div class="user-strip" id="userStrip" style="display:none">
  <div class="user-info">
    <div class="avatar" id="sel-avatar">AC</div>
    <div>
      <div class="user-name" id="sel-name">Student</div>
      <div class="user-email" id="sel-email"></div>
    </div>
  </div>
  <button class="btn-dash" onclick="location.href='yorkstjohn-hub.html'">
    <span class="mat">dashboard</span> Dashboard
  </button>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span class="mat">search</span>
    <input type="text" placeholder="Search courses..." id="searchInput" oninput="filterCourses(this.value)">
  </div>
</div>

<div class="cat-scroll" id="catScroll"></div>
<div class="course-list" id="courseList"></div>

<div class="bottom-cta" id="bottomCta">
  <button class="btn-select" id="selectBtn" onclick="confirmSelect()">
    <span class="mat fill">check_circle</span>
    <div>
      <div>Start Preparing</div>
      <div class="selected-name" id="ctaCourseName"></div>
    </div>
  </button>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=3"></script>
<script src="yorkstjohn-data.js"></script>
<script>
// ── Category icons
const catIcons = {
  'MSc': {icon:'science', bg:'#ede9fe', color:'#7c3aed'},
  'MBA': {icon:'business_center', bg:'#fef3c7', color:'#d97706'},
  'MA': {icon:'history_edu', bg:'#fef2f2', color:'#dc2626'},
  'MRes': {icon:'biotech', bg:'#f0fdf4', color:'#16a34a'},
  'BSc': {icon:'computer', bg:'#eff6ff', color:'#1d4ed8'},
  'BA': {icon:'book_2', bg:'#fff7ed', color:'#ea580c'},
};
function getCatStyle(name) {
  for (const [prefix, style] of Object.entries(catIcons)) {
    if (name.startsWith(prefix)) return style;
  }
  return {icon:'school', bg:'#f3f4f6', color:'#6b7280'};
}

let selectedId = localStorage.getItem('last_course') || null;
let activeFilter = 'All';

const categories = ['All', 'MSc', 'MBA', 'MA', 'MRes', 'BSc/BA'];

function buildCats() {
  const c = document.getElementById('catScroll');
  c.innerHTML = categories.map(cat =>
    `<button class="cat-btn${cat===activeFilter?' active':''}" onclick="setFilter('${cat}')">${cat}</button>`
  ).join('');
}

function setFilter(cat) {
  activeFilter = cat;
  buildCats();
  filterCourses(document.getElementById('searchInput').value);
}

function filterCourses(q = '') {
  const list = document.getElementById('courseList');
  const entries = Object.entries(COURSES);
  const results = entries.filter(([id, c]) => {
    const matchQ = !q || c.name.toLowerCase().includes(q.toLowerCase());
    const matchCat = activeFilter === 'All' ||
      (activeFilter === 'BSc/BA' ? c.name.startsWith('B') : c.name.startsWith(activeFilter));
    return matchQ && matchCat;
  });

  list.innerHTML = results.map(([id, c]) => {
    const s = getCatStyle(c.name);
    const isLondon = c.city === 'London';
    const isSelected = id === selectedId;
    return `<div class="course-card${isSelected?' selected':''}" onclick="selectCourse('${id}')"
      style="${isSelected?'border-color:var(--red);background:#fff5f5;':''}">
      <div class="course-icon" style="background:${s.bg}">
        <span class="mat fill" style="color:${s.color}">${s.icon}</span>
      </div>
      <div class="course-info">
        <div class="course-name">${c.name}</div>
        <div class="course-meta">
          <span class="campus-badge${isLondon?' london':''}">
            <span class="mat" style="font-size:11px">${isLondon?'location_city':'park'}</span>
            ${c.city}
          </span>
          ${c.tuition||''}
        </div>
      </div>
      <div class="course-arrow">
        <span class="mat${isSelected?' fill':''}" style="color:${isSelected?'var(--red)':'var(--muted)'}">
          ${isSelected?'check_circle':'arrow_forward_ios'}
        </span>
      </div>
    </div>`;
  }).join('');
}

function selectCourse(id) {
  selectedId = id;
  const c = COURSES[id];
  localStorage.setItem('last_course', id);
  localStorage.setItem('last_school', 'yorkstjohn');
  // Update CTA
  document.getElementById('ctaCourseName').textContent = c.name;
  document.getElementById('bottomCta').classList.add('show');
  filterCourses(document.getElementById('searchInput').value);
}

async function confirmSelect() {
  const id = selectedId;
  if (!id) return;
  const student = window.getCurrentStudent?.();
  if (student?.id) {
    await window.onCourseSelected?.('yorkstjohn', id);
  }
  location.href = 'yorkstjohn-hub.html';
}

// Init
document.addEventListener('DOMContentLoaded', async () => {
  buildCats();
  filterCourses();
  if (selectedId) {
    const c = COURSES[selectedId];
    if (c) {
      document.getElementById('ctaCourseName').textContent = c.name;
      document.getElementById('bottomCta').classList.add('show');
    }
  }
  // Show user if logged in
  await (window.sessionReady || Promise.resolve());
  const s = window.getCurrentStudent?.();
  if (s?.name) {
    document.getElementById('userStrip').style.display = 'flex';
    document.getElementById('sel-name').textContent = s.name;
    document.getElementById('sel-email').textContent = s.email || '';
    document.getElementById('sel-avatar').textContent =
      s.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  }
});
</script>
</body>
</html>
