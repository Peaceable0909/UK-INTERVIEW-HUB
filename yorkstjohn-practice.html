<style>
/* ═══ CHAT PRACTICE — WhiteRock × YSJ ═══ */
:root{
  --red:#c41230;--red-dk:#9e0e25;
  --green:#16a34a;--green-lt:#dcfce7;
  --amber:#b45309;--amber-lt:#fef3c7;
  --bg:#f0f2f5;--surface:#fff;
  --border:#e4e6ea;
  --t1:#1a1a1a;--t2:#374151;--t3:#6b7280;--t4:#d1d5db;
  --sh:0 2px 12px rgba(0,0,0,.08);
  --topbar:56px;--bottomnav:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mi{font-family:"Material Symbols Outlined";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  vertical-align:middle;line-height:1;user-select:none;font-size:22px}
.mi.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.mi.sm{font-size:18px}.mi.xs{font-size:15px}.mi.lg{font-size:26px}.mi.xl{font-size:32px}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:16px}
button:disabled{opacity:.5;cursor:not-allowed}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:calc(var(--topbar)+env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding-left:16px;padding-right:16px;gap:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.topbar.scrolled{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tb-back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--red);background:#fff5f5;flex-shrink:0}
.tb-title{flex:1;font-size:15px;font-weight:800;color:var(--t1);letter-spacing:-.2px}
.tb-sub{font-size:11px;color:var(--t3);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;
  font-size:12px;font-weight:700;background:var(--bg)}
.chip.muted{color:var(--t3)}

/* ── PROGRESS ── */
.q-strip{position:fixed;top:calc(var(--topbar)+env(safe-area-inset-top));left:0;right:0;z-index:190;
  background:#fff;border-bottom:1px solid var(--border);padding:8px 16px}
.q-strip-bar{margin-top:5px}
.prog-track{height:4px;background:var(--bg);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .4s ease;background:var(--red)}
.q-strip-counter{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.04em;text-transform:uppercase}

/* ── PAGE WRAPPER ── */
.page{padding-top:calc(var(--topbar) + env(safe-area-inset-top) + 52px);
  padding-bottom:calc(var(--bottomnav) + env(safe-area-inset-bottom) + 16px)}
.pad{max-width:680px;margin:0 auto;padding:0 12px}

/* ── MOCK INTERVIEW BANNER ── */
.mock-banner{display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,#0f172a,#1e1b4b);
  border-radius:16px;padding:14px 16px;margin-bottom:14px;text-decoration:none;
  -webkit-tap-highlight-color:transparent}
.mock-icon{width:44px;height:44px;border-radius:50%;background:#c41230;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 16px rgba(196,18,48,.5)}

/* ══ CHAT LAYOUT ══ */
.chat-wrap{display:flex;flex-direction:column;gap:0}

/* Question card — AI bubble (left) */
.chat-ai{display:flex;align-items:flex-start;gap:8px;padding:12px 0 4px}
.ai-avatar{width:36px;height:36px;border-radius:50%;background:var(--red);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;
  box-shadow:0 2px 8px rgba(196,18,48,.25)}
.ai-avatar .mi{font-size:18px;color:#fff}
.ai-bubble{max-width:88%;background:#fff;border-radius:18px 18px 18px 4px;
  padding:14px 16px;box-shadow:var(--sh);border:1px solid var(--border)}
.ai-label{font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:6px}
.ai-cat-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  color:var(--red);background:#fff5f5;border-radius:99px;padding:3px 9px;margin-bottom:8px}
.ai-question{font-size:15px;font-weight:700;color:var(--t1);line-height:1.5}
.ai-hint-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  color:var(--t3);background:none;border:1px solid var(--border);border-radius:99px;
  padding:5px 10px;margin-top:10px;cursor:pointer;transition:all .2s}
.ai-hint-btn:hover{color:var(--amber);border-color:var(--amber)}
.ai-hint-box{display:none;margin-top:10px;font-size:13px;color:var(--t2);line-height:1.6;
  background:#fffbeb;border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 12px}
.ai-hint-box.show{display:block}

/* Student message (right) */
.chat-student{display:flex;justify-content:flex-end;padding:4px 0 4px}
.student-bubble{max-width:88%;background:#c41230;border-radius:18px 18px 4px 18px;
  padding:12px 16px;box-shadow:0 2px 10px rgba(196,18,48,.25)}
.student-bubble p{font-size:14px;color:#fff;line-height:1.6;font-weight:500}
.student-meta{font-size:11px;color:rgba(255,255,255,.6);margin-top:5px;text-align:right}

/* Input area */
.input-row{background:#fff;border-radius:16px;padding:12px 14px;
  box-shadow:var(--sh);border:1.5px solid var(--border);margin:6px 0;
  transition:border-color .2s}
.input-row:focus-within{border-color:var(--red)}
.q-answer{width:100%;border:none;outline:none;resize:none;font-family:inherit;
  font-size:14px;line-height:1.6;color:var(--t1);min-height:88px;max-height:200px;
  background:transparent}
.q-answer::placeholder{color:var(--t4)}
.input-footer{display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.char-count{font-size:11px;color:var(--t4);font-family:monospace}
.actions-row{display:flex;gap:8px;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;
  border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
  transition:all .15s;white-space:nowrap;border:none}
.btn.red{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(196,18,48,.3)}
.btn.red:hover{background:var(--red-dk);transform:translateY(-1px)}
.btn.outline{background:#fff;color:var(--t2);border:1.5px solid var(--border)}
.btn.outline:hover{border-color:var(--t3)}
.btn.sm{padding:7px 14px;font-size:13px}

/* ══ AI FEEDBACK BUBBLE ══ */
.feedback-wrap{padding:4px 0 8px}
.feedback-ai{display:flex;align-items:flex-start;gap:8px}
.fb-bubble{flex:1;max-width:92%;background:#fff;border-radius:18px 18px 18px 4px;
  padding:16px 18px;box-shadow:var(--sh);border:1px solid var(--border)}

/* Score header */
.fb-score-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;
  padding-bottom:14px;border-bottom:1px solid var(--border)}
.fb-score-circle{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;flex-shrink:0;font-weight:900}
.fb-score-circle.pass{background:var(--green-lt);color:var(--green)}
.fb-score-circle.fail{background:#fee2e2;color:#dc2626}
.fb-score-num{font-size:22px;line-height:1;font-weight:900}
.fb-score-den{font-size:10px;font-weight:700;opacity:.7}
.fb-verdict{font-size:15px;font-weight:800;color:var(--t1);margin-bottom:3px}
.fb-summary{font-size:13px;color:var(--t3);line-height:1.5}

/* Analysis sections */
.fb-section{margin-bottom:12px}
.fb-section-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fb-section-head.good{color:var(--green)}
.fb-section-head.bad{color:#dc2626}
.fb-section-head.tip{color:var(--amber)}
.fb-section-head.example{color:#7c3aed}
.fb-text{font-size:13px;color:var(--t2);line-height:1.65}
.fb-example-box{background:#f5f3ff;border-left:3px solid #7c3aed;border-radius:0 8px 8px 0;
  padding:10px 12px;font-size:13px;color:#4c1d95;line-height:1.65;font-style:italic;margin-top:6px}
.fb-checklist{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:4px}
.fb-checklist li{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--t2);line-height:1.5}
.fb-checklist .ck-icon{flex-shrink:0;margin-top:1px;font-size:15px}
.fb-checklist .ck-icon.ok{color:var(--green)}
.fb-checklist .ck-icon.miss{color:#dc2626}

/* Retry/next buttons */
.fb-actions{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

/* Loading bubble */
.typing-bubble{display:flex;align-items:flex-start;gap:8px;padding:8px 0}
.typing-dots{display:flex;gap:4px;padding:14px 18px;background:#fff;
  border-radius:18px 18px 18px 4px;box-shadow:var(--sh);border:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t4);
  animation:dotBounce .9s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes dotBounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Error */
.error-bubble{background:#fff5f5;border:1px solid #fecaca;border-radius:12px;
  padding:14px;text-align:center;margin:8px 0}

/* Toast */
#toast{position:fixed;bottom:calc(var(--bottomnav)+env(safe-area-inset-bottom)+10px);
  left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;
  padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;
  display:none;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* Loading screen */
.ai-loading{display:none;text-align:center;padding:24px 16px}
.ai-loading.show{display:block}
.ai-anim{font-size:42px;margin-bottom:12px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.95)}}
.ai-loading-text{font-size:15px;font-weight:700;color:var(--t1)}
.ai-loading-sub{font-size:13px;color:var(--t3);margin-top:4px}

/* Bottom nav */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:calc(var(--bottomnav)+env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:stretch}
.bn-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:10px;font-weight:600;color:var(--t3);
  -webkit-tap-highlight-color:transparent;text-decoration:none;padding:4px 2px}
.bn-tab.active{color:var(--red)}
.bn-tab .mi{font-size:20px}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
let currentIdx = 0;
let hintShown = false;
let attemptCount = 0;  // per-question attempt counter

const fromQBank = location.search.includes('from=qbank');
const storedQ = fromQBank ? JSON.parse(sessionStorage.getItem('ysj_practice_q')||'null') : null;

function getQueue() {
  if (storedQ) return [{id:'custom',cat:'custom',q:storedQ.q,hint:'Answer specifically and give a concrete example.',cr:'Give a complete, personalised answer with specific examples and comparisons.'}];
  return PQS;
}

function showQ(idx) {
  currentIdx = idx;
  attemptCount = 0;
  hintShown = false;
  const queue = getQueue();
  const q = queue[idx];
  if (!q) return;

  const pct = Math.round((idx+1)/queue.length*100);
  document.getElementById('q-label').textContent = 'Q '+(idx+1)+'/'+queue.length;
  document.getElementById('q-counter').textContent = 'Question '+(idx+1)+' of '+queue.length;
  document.getElementById('q-prog').style.width = pct+'%';

  const catIcons = {uk:'public',ysj:'account_balance',course:'menu_book',
    career:'trending_up',finance:'payments',living:'home',visa:'badge',custom:'mic'};
  const catNames = {uk:'Why the UK',ysj:'Why York St John',course:'Course Knowledge',
    career:'Career Plans',finance:'Finance',living:'Accommodation',visa:'Visa Rules',custom:'Your Question'};

  const area = document.getElementById('q-area');
  area.innerHTML = `
    <div class="chat-wrap" id="chat-wrap">

      <!-- AI question bubble -->
      <div class="chat-ai">
        <div class="ai-avatar"><span class="mi fill sm">psychology</span></div>
        <div class="ai-bubble">
          <div class="ai-label">AI Coach</div>
          <div class="ai-cat-tag">
            <span class="mi xs fill">${catIcons[q.cat]||'quiz'}</span>
            ${catNames[q.cat]||q.cat}
          </div>
          <div class="ai-question">${q.q}</div>
          <button class="ai-hint-btn" onclick="toggleHint()" id="hint-btn">
            <span class="mi xs">tips_and_updates</span> Show hint
          </button>
          <div class="ai-hint-box" id="hint-box">${q.hint}</div>
        </div>
      </div>

      <!-- Conversation history (student replies + feedback appear here) -->
      <div id="convo-thread"></div>

      <!-- Loading typing indicator (hidden by default) -->
      <div class="typing-bubble" id="typing-indicator" style="display:none">
        <div class="ai-avatar"><span class="mi fill sm">psychology</span></div>
        <div class="typing-dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-row" id="input-row">
        <textarea class="q-answer" id="q-ans"
          placeholder="Type your answer here… Be specific — give examples, name modules, mention your campus address, compare with other universities…"
          rows="4"
          oninput="updateCharCount(this)"
          aria-label="Your answer"></textarea>
        <div class="input-footer">
          <span class="char-count" id="char-count">0 chars</span>
          <div class="actions-row">
            ${idx < queue.length-1
              ? `<button class="btn outline sm" onclick="showQ(${idx+1})" aria-label="Skip">
                  <span class="mi sm">skip_next</span> Skip
                 </button>`
              : ''}
            <button class="btn red sm" id="check-btn" onclick="checkAnswer()">
              <span class="mi fill sm">send</span> Send
            </button>
          </div>
        </div>
      </div>

    </div>
  `;
}

function updateCharCount(el) {
  document.getElementById('char-count').textContent = el.value.length + ' chars';
}

function toggleHint() {
  hintShown = !hintShown;
  document.getElementById('hint-box').classList.toggle('show', hintShown);
  const btn = document.getElementById('hint-btn');
  btn.innerHTML = `<span class="mi xs">tips_and_updates</span> ${hintShown?'Hide hint':'Show hint'}`;
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function checkAnswer() {
  const ansEl = document.getElementById('q-ans');
  const ans = ansEl?.value?.trim();
  if (!ans || ans.length < 20) { showToast('Please write a longer answer first'); return; }

  const checkBtn = document.getElementById('check-btn');
  const typing = document.getElementById('typing-indicator');
  const inputRow = document.getElementById('input-row');
  checkBtn.disabled = true;
  attemptCount++;

  // 1. Show student bubble
  const thread = document.getElementById('convo-thread');
  const now = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const studentDiv = document.createElement('div');
  studentDiv.className = 'chat-student';
  studentDiv.innerHTML = `
    <div class="student-bubble">
      <p>${escHtml(ans)}</p>
      <div class="student-meta">You · Attempt ${attemptCount} · ${now}</div>
    </div>`;
  thread.appendChild(studentDiv);

  // 2. Clear input, show typing
  ansEl.value = '';
  document.getElementById('char-count').textContent = '0 chars';
  inputRow.style.display = 'none';
  typing.style.display = 'flex';
  typing.scrollIntoView({behavior:'smooth',block:'end'});

  try {
    const queue = getQueue();
    const q = queue[currentIdx];
    const course = window.getCurrentCourse?.() || {};

    const prompt = `You are a strict but supportive UK student visa credibility interview coach. 
Your job is to help students improve their answers through detailed, constructive chat feedback.

Course: "${course.name||'their chosen course'}" at ${course.campus||'York St John University'}.
Question: "${q.q}"
Required content criteria: ${q.cr}
Student answer (Attempt ${attemptCount}): "${ans}"

ASSESSMENT STANDARD (same as a UKVI Entry Clearance Officer):
- A credible answer = STATEMENT + CONCRETE EXAMPLE. A statement alone is never enough.
- PASS threshold: score >= 70

BANNED PHRASES (each costs -20 unless followed by a specific example):
"highly renowned globally", "globally recognised", "strong reputation" (without ranking/award),
"fees are less/more affordable" (without figures), "world-class education" (without evidence),
"gain better employment" (without specific role/employer), any reason applicable to any country.

AUTOMATIC FAIL caps: under 30 words → max 30 | completely off-topic → max 20 | no specifics at all → max 35

MAJOR DEDUCTIONS (-15 to -25 each if missing):
No module names when required (-25) | No country/university comparison when relevant (-20) |
Career plan with no timeline structure (-20) | Vague funding source (-20) | 
No personal language (-20) | Factually wrong about course/campus (-20) | No campus address when needed (-15)

CALIBRATION: Most first attempts score 45-72. Scores above 80 require exceptional specificity.

Return ONLY valid JSON, no markdown:
{
  "pass": boolean,
  "score": integer 0-100,
  "summary": "1 concise sentence on the overall answer quality",
  "what_worked": "specific strength in their actual answer — quote their words if useful",
  "what_missed": "the single most important gap that hurt their score",
  "checklist": [
    {"item": "requirement 1 from the criteria", "met": true/false},
    {"item": "requirement 2", "met": true/false},
    {"item": "requirement 3", "met": true/false}
  ],
  "example_answer": "A 2-3 sentence example showing exactly how to answer this question well — specific, personal, with real details relevant to their course",
  "encouragement": "short warm sentence to motivate them to try again (if failed) or congratulate them (if passed)"
}`;

    const resp = await puter.ai.chat(prompt, {model:'gpt-4o-mini'});
    let raw = typeof resp==='string' ? resp : resp?.message?.content || JSON.stringify(resp);
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('No JSON in response');
    const j = JSON.parse(match[0]);
    const passed = j.pass || j.score >= 70;
    const score = j.score || 0;

    // 3. Hide typing, build feedback bubble
    typing.style.display = 'none';

    const fbDiv = document.createElement('div');
    fbDiv.className = 'feedback-wrap';

    const checklistHtml = (j.checklist||[]).map(c=>`
      <li>
        <span class="mi fill ck-icon ${c.met?'ok':'miss'}">${c.met?'check_circle':'cancel'}</span>
        <span>${escHtml(c.item)}</span>
      </li>`).join('');

    const isLast = currentIdx >= getQueue().length - 1;
    fbDiv.innerHTML = `
      <div class="feedback-ai">
        <div class="ai-avatar"><span class="mi fill sm">psychology</span></div>
        <div class="fb-bubble">

          <!-- Score header -->
          <div class="fb-score-row">
            <div class="fb-score-circle ${passed?'pass':'fail'}">
              <div class="fb-score-num">${score}</div>
              <div class="fb-score-den">/100</div>
            </div>
            <div>
              <div class="fb-verdict">${passed?'✅ Good answer!':'❌ Needs improvement'}</div>
              <div class="fb-summary">${escHtml(j.summary||'')}</div>
            </div>
          </div>

          <!-- What worked -->
          ${j.what_worked ? `
          <div class="fb-section">
            <div class="fb-section-head good"><span class="mi fill xs">check_circle</span>What worked</div>
            <div class="fb-text">${escHtml(j.what_worked)}</div>
          </div>` : ''}

          <!-- What missed -->
          ${j.what_missed ? `
          <div class="fb-section">
            <div class="fb-section-head bad"><span class="mi fill xs">cancel</span>Main gap</div>
            <div class="fb-text">${escHtml(j.what_missed)}</div>
          </div>` : ''}

          <!-- Checklist -->
          ${checklistHtml ? `
          <div class="fb-section">
            <div class="fb-section-head tip"><span class="mi fill xs">fact_check</span>Requirements checklist</div>
            <ul class="fb-checklist">${checklistHtml}</ul>
          </div>` : ''}

          <!-- Example answer -->
          ${j.example_answer ? `
          <div class="fb-section">
            <div class="fb-section-head example"><span class="mi fill xs">lightbulb</span>Example of a strong answer</div>
            <div class="fb-example-box">${escHtml(j.example_answer)}</div>
          </div>` : ''}

          <!-- Encouragement + actions -->
          ${j.encouragement ? `<div class="fb-text" style="color:var(--t3);font-style:italic;margin-bottom:12px">${escHtml(j.encouragement)}</div>` : ''}

          <div class="fb-actions">
            ${!passed ? `
            <button class="btn red sm" style="flex:1" onclick="retryQ()">
              <span class="mi fill sm">refresh</span> Try again
            </button>` : ''}
            <button class="btn outline sm" style="flex:${passed?2:1}" onclick="${isLast?`location.href='yorkstjohn-hub.html'`:`showQ(${currentIdx+1})`}">
              <span class="mi fill sm">${isLast?'home':'arrow_forward'}</span>
              ${isLast?'Back to hub':'Next question'}
            </button>
          </div>

        </div>
      </div>`;

    thread.appendChild(fbDiv);

    // Show input again for retry (if failed)
    if (!passed) {
      inputRow.style.display = 'block';
      checkBtn.disabled = false;
      // Update placeholder
      const ta = document.getElementById('q-ans');
      if(ta) ta.placeholder = 'Try again — use the example above as a guide…';
    }

    fbDiv.scrollIntoView({behavior:'smooth', block:'start'});

    // 4. Save to admin
    if (typeof window.saveAIResponse === 'function') {
      const normScore = Math.round(score/10);
      // Save with full feedback including example and checklist
      const fullFeedback = [
        j.summary,
        j.what_missed ? 'Gap: ' + j.what_missed : '',
        j.example_answer ? 'Example: ' + j.example_answer : ''
      ].filter(Boolean).join(' | ');
      await window.saveAIResponse('YSJ_'+q.id, ans, normScore, fullFeedback, q.q);
      const xp = parseInt(localStorage.getItem('ysj_xp')||'0') + (passed?20:10);
      localStorage.setItem('ysj_xp', xp);
    }
    const today = new Date().toDateString();
    if (localStorage.getItem('ysj_streak_date')!==today) {
      const streak = parseInt(localStorage.getItem('ysj_streak')||'0')+1;
      localStorage.setItem('ysj_streak', streak);
      localStorage.setItem('ysj_streak_date', today);
    }

  } catch(e) {
    typing.style.display = 'none';
    inputRow.style.display = 'block';
    checkBtn.disabled = false;
    const errDiv = document.createElement('div');
    errDiv.className = 'feedback-wrap';
    errDiv.innerHTML = `
      <div class="feedback-ai">
        <div class="ai-avatar"><span class="mi fill sm">psychology</span></div>
        <div class="error-bubble">
          <span class="mi" style="color:var(--t4);font-size:28px;display:block;margin-bottom:6px">wifi_off</span>
          <p style="font-size:14px;font-weight:700;color:var(--t2)">Could not connect to AI</p>
          <p style="font-size:13px;color:var(--t3);margin-top:4px">Make sure you are signed in to Puter and have internet access.</p>
        </div>
      </div>`;
    document.getElementById('convo-thread').appendChild(errDiv);
  }
}

function retryQ() {
  // Keep the conversation history visible, just re-show the input
  const inputRow = document.getElementById('input-row');
  const checkBtn = document.getElementById('check-btn');
  if (inputRow) inputRow.style.display = 'block';
  if (checkBtn) checkBtn.disabled = false;
  const ta = document.getElementById('q-ans');
  if (ta) {
    ta.focus();
    ta.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

document.addEventListener('DOMContentLoaded', () => { showQ(0); });
</script>

<script>
// Scroll-aware topbar shadow
window.addEventListener('scroll', () => {
  const tb = document.querySelector('.topbar,.ysj-topbar');
  if (tb) tb.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });
</script>
</body>
</html>
