<style>
/* ═══════════════════════════════════════════════════════════
   WhiteRock × York St John — Design System v2
   UI/UX Pro Max: 8dp grid · 44px targets · system fonts
   Style: Clean flat + subtle depth (EdTech / Apple-like)
═══════════════════════════════════════════════════════════ */
:root{
  /* Brand */
  --red:#c41230; --red-dk:#9e0e25; --red-lt:#fff5f5; --red-mid:#fecaca;
  --navy:#1a1a2e; --navy2:#0f172a;
  /* Neutrals */
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#fafafa;
  --border:#e5e7eb; --divider:#f3f4f6;
  /* Text */
  --t1:#1d1d1f; --t2:#3c3c43; --t3:#6e6e73; --t4:#aeaeb2;
  /* Semantic */
  --green:#1c7c54; --green-lt:#d1fae5; --green-bg:#f0fdf4;
  --amber:#b45309; --amber-lt:#fef3c7; --amber-bg:#fffbeb;
  --blue:#1d4ed8; --blue-lt:#dbeafe; --blue-bg:#eff6ff;
  --purple:#5b21b6; --purple-lt:#ede9fe; --purple-bg:#faf5ff;
  --teal:#0d7377; --teal-lt:#ccfbf1; --teal-bg:#f0fdfa;
  /* Spacing (8dp) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:28px; --s8:32px; --s10:40px; --s12:48px;
  /* Radii */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:99px;
  /* Elevation */
  --sh-1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-2:0 4px 12px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
  --sh-3:0 12px 32px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.06);
  /* Layout */
  --topbar:56px; --bottomnav:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--t1);line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* Material Symbols */
.mi{
  font-family:"Material Symbols Outlined";
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  vertical-align:middle;line-height:1;user-select:none;
  font-size:22px; /* prevents shift */
}
.mi.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24;}
.mi.sm{font-size:18px;}
.mi.xs{font-size:16px;}
.mi.lg{font-size:26px;}
.mi.xl{font-size:32px;}
/* Headings */
h1{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.15;letter-spacing:-.3px;color:var(--t1);}
h2{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.2px;color:var(--t1);}
h3{font-size:16px;font-weight:700;line-height:1.3;color:var(--t1);}
p{color:var(--t3);line-height:1.5;}
/* Links */
a{text-decoration:none;color:inherit;}
/* Buttons */
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:16px;}
button:disabled{opacity:.5;cursor:not-allowed;}
/* ── TOP BAR ─────────────────────────────────────────── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:calc(var(--topbar) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding-left:var(--s2);padding-right:var(--s4);gap:var(--s2);
}
.topbar-back{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--navy);-webkit-tap-highlight-color:transparent;
  transition:background .15s;flex-shrink:0;
}
.topbar-back:hover,.topbar-back:active{background:var(--divider);}
.topbar-title{font-size:17px;font-weight:700;color:var(--t1);flex:1;letter-spacing:-.2px;}
.topbar-action{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.topbar-action:hover,.topbar-action:active{background:var(--divider);}
.topbar-badge-wrap{position:relative;}
.notif-badge{
  position:absolute;top:6px;right:6px;
  width:8px;height:8px;border-radius:50%;
  background:var(--red);border:2px solid #fff;
  display:none;
}
.notif-badge.on{display:block;}
/* ── PAGE BODY ───────────────────────────────────────── */
.page{
  padding-top:calc(var(--topbar) + env(safe-area-inset-top) + var(--s4));
  padding-bottom:calc(var(--bottomnav) + env(safe-area-inset-bottom) + var(--s6));
}
.pad{padding-left:var(--s4);padding-right:var(--s4);}
/* ── BOTTOM NAV ──────────────────────────────────────── */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:calc(var(--bottomnav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);
  align-items:start;
}
.bn-tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px var(--s2) 6px;
  color:var(--t4);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
  transition:color .15s;
}
.bn-tab .mi{font-size:24px;transition:all .15s;}
.bn-tab.active{color:var(--red);}
.bn-tab.active .mi{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24;}
/* ── CARD ────────────────────────────────────────────── */
.card{
  background:var(--surface);border-radius:var(--r-xl);
  border:1px solid var(--border);overflow:hidden;
}
.card+.card{margin-top:var(--s3);}
/* ── SECTION HEADER ──────────────────────────────────── */
.sec-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--s4);
}
.sec-title{font-size:18px;font-weight:800;color:var(--t1);letter-spacing:-.2px;}
.sec-sub{font-size:13px;color:var(--t3);margin-top:2px;}
.sec-link{
  font-size:13px;font-weight:700;color:var(--red);
  display:flex;align-items:center;gap:2px;
}
/* ── BUTTONS ─────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:var(--s2);border-radius:var(--r-md);font-weight:700;
  min-height:44px;padding:0 var(--s5);font-size:15px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:filter .15s, opacity .15s;
  touch-action:manipulation;
}
.btn:active{filter:brightness(.93);}
.btn.full{width:100%;}
.btn.red{background:var(--red);color:#fff;}
.btn.navy{background:var(--navy);color:#fff;}
.btn.outline{border:1.5px solid var(--border);background:var(--surface);color:var(--t1);}
.btn.ghost{background:transparent;color:var(--red);border:none;}
.btn.lg{min-height:52px;font-size:16px;border-radius:14px;}
/* ── CHIPS / BADGES ──────────────────────────────────── */
.chip{
  display:inline-flex;align-items:center;gap:var(--s1);
  border-radius:var(--r-pill);padding:5px 12px;
  font-size:12px;font-weight:700;
}
.chip.red{background:var(--red-lt);color:var(--red);}
.chip.green{background:var(--green-lt);color:var(--green);}
.chip.navy{background:#e8eaf2;color:var(--navy);}
.chip.muted{background:var(--divider);color:var(--t3);}
.chip.border{background:var(--surface);border:1.5px solid var(--border);color:var(--t2);}
/* ── INPUT ───────────────────────────────────────────── */
.input{
  width:100%;border:1.5px solid var(--border);
  border-radius:var(--r-md);padding:12px 14px;
  font-size:16px;font-family:inherit;
  outline:none;background:var(--surface);
  transition:border-color .15s;color:var(--t1);
}
.input:focus{border-color:var(--red);}
.textarea{resize:none;min-height:120px;line-height:1.5;}
/* ── DIVIDER ─────────────────────────────────────────── */
.hr{height:1px;background:var(--divider);margin:var(--s4) 0;}
/* ── SHIMMER SKELETON ────────────────────────────────── */
.skeleton{
  background:linear-gradient(90deg,var(--divider) 25%,#ebebeb 50%,var(--divider) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:var(--r-sm);
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* ── SPINNER ─────────────────────────────────────────── */
.spinner{
  width:20px;height:20px;
  border:2.5px solid var(--divider);
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:inline-block;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg);}}
/* ── TOAST ───────────────────────────────────────────── */
#toast{
  display:none;position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%);
  background:var(--t1);color:#fff;
  padding:10px 20px;border-radius:var(--r-pill);
  font-size:14px;font-weight:600;z-index:9999;
  box-shadow:var(--sh-3);white-space:nowrap;
}
/* ── PROGRESS BAR ────────────────────────────────────── */
.prog-track{
  height:6px;background:var(--divider);
  border-radius:var(--r-pill);overflow:hidden;
}
.prog-fill{
  height:100%;border-radius:var(--r-pill);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
/* ── SAFE AREAS ──────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
/* ── RESPONSIVE ──────────────────────────────────────── */
@media(min-width:768px){
  .page{max-width:560px;margin:0 auto;}
  .topbar{max-width:560px;left:50%;transform:translateX(-50%);}
  .bottomnav{max-width:560px;left:50%;transform:translateX(-50%);}
}
</style>
<style>
/* Progress header strip */
.q-strip{
  position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top));z-index:90;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px var(--s4);
  display:flex;align-items:center;gap:var(--s3);
}
.q-strip-counter{font-size:13px;font-weight:700;color:var(--t2);white-space:nowrap;}
.q-strip-bar{flex:1;}
/* Question card */
.q-card{
  background:var(--surface);border-radius:var(--r-xl);
  border:1px solid var(--border);overflow:hidden;
  margin-bottom:var(--s4);
}
.q-card-top{padding:var(--s5) var(--s5) var(--s4);}
.q-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg);border-radius:var(--r-pill);
  padding:5px 12px;font-size:11px;font-weight:800;
  color:var(--t3);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:var(--s4);
}
.q-tag .mi{font-size:15px;}
.q-question{font-size:clamp(16px,4vw,20px);font-weight:800;color:var(--t1);
  line-height:1.4;margin-bottom:var(--s3);}
.q-hint-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:700;color:var(--red);
  padding:0;-webkit-tap-highlight-color:transparent;
}
.q-hint-toggle .mi{font-size:18px;}
.q-hint-box{
  background:var(--amber-bg);border-left:3px solid var(--amber);
  border-radius:0 var(--r-md) var(--r-md) 0;
  padding:var(--s4);margin:var(--s3) var(--s5) 0;
  font-size:13px;color:var(--t2);line-height:1.5;display:none;
}
.q-hint-box.show{display:block;}
.q-answer-wrap{padding:var(--s4) var(--s5) var(--s5);}
.q-answer{
  width:100%;border:1.5px solid var(--border);
  border-radius:var(--r-lg);padding:var(--s4);
  font-size:16px;font-family:inherit;resize:none;
  outline:none;background:var(--surface);color:var(--t1);
  min-height:140px;line-height:1.5;
  transition:border-color .15s;
}
.q-answer:focus{border-color:var(--red);}
.q-char-count{font-size:11px;color:var(--t4);text-align:right;margin-top:4px;}
/* Action row */
.q-actions{display:flex;gap:var(--s3);margin-top:var(--s4);}
.q-actions .btn{flex:1;}
/* Feedback card */
.fb-card{
  border-radius:var(--r-xl);overflow:hidden;
  margin-bottom:var(--s4);border:1.5px solid;
}
.fb-card.pass{background:var(--green-bg);border-color:#86efac;}
.fb-card.fail{background:var(--red-lt);border-color:#fca5a5;}
.fb-top{
  padding:var(--s5) var(--s5) var(--s3);
  display:flex;align-items:center;gap:var(--s4);
}
.fb-score{font-size:40px;font-weight:900;line-height:1;}
.fb-score.pass{color:var(--green);}
.fb-score.fail{color:var(--red);}
.fb-score-lbl{font-size:12px;color:var(--t3);margin-top:2px;}
.fb-verdict{font-size:16px;font-weight:800;color:var(--t1);}
.fb-summary{font-size:14px;color:var(--t2);margin-top:4px;line-height:1.5;}
.fb-sections{padding:0 var(--s5) var(--s5);}
.fb-section{margin-bottom:var(--s4);}
.fb-section-lbl{font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--t3);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;}
.fb-section-lbl .mi{font-size:15px;}
.fb-section-text{font-size:14px;color:var(--t2);line-height:1.5;
  background:rgba(255,255,255,.6);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);}
/* AI loading */
.ai-loading{
  background:var(--surface);border-radius:var(--r-xl);
  border:1px solid var(--border);padding:var(--s8) var(--s5);
  text-align:center;margin-bottom:var(--s4);display:none;
}
.ai-loading.show{display:block;}
.ai-anim{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--red-lt),#ede9fe);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto var(--s4);animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ai-loading-text{font-size:15px;font-weight:700;color:var(--t2);}
.ai-loading-sub{font-size:13px;color:var(--t3);margin-top:4px;}
</style>
</head>

<script>
let currentIdx = 0;
let hintShown = false;

// Check if coming from question bank with a specific question
const fromQBank = location.search.includes('from=qbank');
const storedQ = fromQBank ? JSON.parse(sessionStorage.getItem('ysj_practice_q')||'null') : null;

function getQueue() {
  if (storedQ) return [{id:'custom',cat:'custom',q:storedQ.q,hint:'Answer specifically and give a concrete example.',cr:'Give a complete, personalised answer with specific examples and comparisons.'}];
  return PQS;
}

function showQ(idx) {
  currentIdx = idx;
  const queue = getQueue();
  const q = queue[idx];
  if (!q) return;
  hintShown = false;

  // Update progress
  const pct = Math.round((idx+1)/queue.length*100);
  document.getElementById('q-label').textContent = 'Q '+(idx+1)+'/'+queue.length;
  document.getElementById('q-counter').textContent = 'Question '+(idx+1)+' of '+queue.length;
  document.getElementById('q-prog').style.width = pct+'%';

  const catIcons = {uk:'public',ysj:'account_balance',course:'menu_book',
    career:'trending_up',finance:'payments',living:'home',visa:'badge',custom:'mic'};
  const catNames = {uk:'Why the UK',ysj:'Why York St John',course:'Course Knowledge',
    career:'Career Plans',finance:'Finance',living:'Accommodation',visa:'Visa Rules',custom:'Your Question'};

  const area = document.getElementById('q-area');
  area.innerHTML = `
    <div class="q-card">
      <div class="q-card-top">
        <div class="q-tag">
          <span class="mi fill" aria-hidden="true">${catIcons[q.cat]||'quiz'}</span>
          ${catNames[q.cat]||q.cat}
        </div>
        <h2 class="q-question">${q.q}</h2>
        <button class="q-hint-toggle" onclick="toggleHint()" aria-expanded="false" id="hint-btn">
          <span class="mi sm">tips_and_updates</span>
          Show hint
        </button>
      </div>
      <div class="q-hint-box" id="hint-box">${q.hint}</div>
      <div class="q-answer-wrap">
        <textarea class="q-answer" id="q-ans"
          placeholder="Write your answer here. Be specific — give examples for every statement, name the university address, mention comparisons with at least one other country or university…"
          rows="6"
          oninput="updateCharCount(this)"
          aria-label="Your answer"></textarea>
        <div class="q-char-count" id="char-count">0 characters</div>
        <div class="q-actions">
          <button class="btn red" id="check-btn" onclick="checkAnswer()"
            aria-label="Check answer with AI">
            <span class="mi fill sm">psychology</span>
            Check with AI
          </button>
          ${idx < queue.length-1
            ? `<button class="btn outline" onclick="showQ(${idx+1})" aria-label="Skip to next question">
                <span class="mi sm">skip_next</span> Skip
               </button>`
            : ''}
        </div>
      </div>
    </div>
    <div class="ai-loading" id="ai-loading">
      <div class="ai-anim"><span class="mi xl fill" style="color:var(--red)">psychology</span></div>
      <div class="ai-loading-text">AI is evaluating your answer…</div>
      <div class="ai-loading-sub">This takes about 5–10 seconds</div>
    </div>
    <div id="fb-area"></div>
  `;
}

function updateCharCount(el) {
  document.getElementById('char-count').textContent = el.value.length + ' characters';
}

function toggleHint() {
  hintShown = !hintShown;
  const box = document.getElementById('hint-box');
  const btn = document.getElementById('hint-btn');
  box.classList.toggle('show', hintShown);
  btn.setAttribute('aria-expanded', hintShown);
  btn.innerHTML = `<span class="mi sm">tips_and_updates</span> ${hintShown?'Hide hint':'Show hint'}`;
}

async function checkAnswer() {
  const ans = document.getElementById('q-ans')?.value?.trim();
  if (!ans || ans.length < 20) { showToast('Please write a longer answer (at least a few sentences)'); return; }

  const checkBtn = document.getElementById('check-btn');
  const loading = document.getElementById('ai-loading');
  checkBtn.disabled = true;
  loading.classList.add('show');

  try {
    const queue = getQueue();
    const q = queue[currentIdx];
    const course = window.getCurrentCourse?.() || {};
    const prompt = `You are a strict UK student visa credibility interview examiner. You assess answers exactly as a UKVI Entry Clearance Officer would — applying the same scrutiny used in real credibility interview refusals.

Course: "${course.name}" at ${course.campus}.
Question: "${q.q}"
Required content: ${q.cr}
Student answer: "${ans}"

CORE PRINCIPLE — THE ONLY THING THAT MATTERS:
A credible answer = STATEMENT + CONCRETE EXAMPLE.
A statement alone is NEVER enough. UKVI caseworkers are trained to reject any answer that lacks specific, verifiable examples. This is confirmed in real refusal letters.
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

BANNED PHRASES — These appear word-for-word in real UKVI refusal letters as evidence of a "generic, surface-level" answer. Deduct -20 for EACH unless immediately followed by a specific, verifiable example:
• "highly renowned globally" or "globally recognised"
• "strong reputation" (without citing a ranking, table, or award)
• "fees are less" or "more affordable" (without a comparison figure)
• "good/fast processing times" as a reason to choose the UK
• "I want to solve problems" as a career goal
• "gain better employment" or "better job opportunities" (without a specific role/employer)
• "world-class education" (without evidence)
• Any reason that would equally apply to Australia, Canada, or the US with no UK-specific distinction

AUTOMATIC FAIL — cap score as shown:
• Answer is under 30 words or 1–2 sentences → cap at 30
• Completely off-topic → cap at 20
• Could apply to ANY country or university — zero specifics → cap at 35
• Entirely banned phrases with no examples → cap at 25

MAJOR DEDUCTIONS — apply each that is missing (-15 to -25):
• No module names when course knowledge is required → -25
• No comparison with at least one other country OR university when relevant → -20
• Career plan has no structure: must include short-term (0–2 yr), medium-term (3–5 yr), long-term (5–10 yr) → -20
• Financial source is vague ("my parents/family are paying") — must name source of funds (savings, property sale, inheritance, salary, sponsorship) → -20
• No personal language ("I", "my", "I chose") — reads like a copied brochure → -20
• Factually incorrect about the course, campus, or university → -20
• No campus location or city when question requires it → -15

MODERATE DEDUCTIONS (-8 to -12):
• Only 1 module named when 2–3 expected → -10
• Career role named but no timeline or employer named → -12
• Comparison given but no specific detail about the alternative (e.g., just "Canada") → -10
• Funding source named but no documentary basis mentioned → -10
• Rambling, unfocused answer with no clear structure → -8
• Accommodation plan with no cost or location specifics → -8

MINOR DEDUCTIONS (-3 to -5):
• Statement + example present but example is weak or very brief → -5
• Missing one minor detail from required content → -3
• Adequate answer but lacks personal connection or enthusiasm → -5

CALIBRATION:
• Most students score 45–72 on a first attempt
• Scores above 80 require: exceptional specificity, named sources (rankings, statistics, figures), full career structure, funding evidence, personal voice
• A "decent" answer with some specifics but gaps → 55–65, NOT 75+
• PASS THRESHOLD: score >= 70
• Most first attempts should NOT pass — the bar reflects the actual UKVI standard

Do NOT penalise: punctuation, capitalisation, minor spelling, grammar, or accent.

Return ONLY valid JSON — no markdown, no explanation, nothing else:
{"pass": boolean, "score": integer 0-100, "summary": "one sentence about the answer", "good": ["one specific strength"], "improve": ["one specific improvement needed"]}

CRITICAL: Evaluate the ACTUAL student answer. Do NOT return a default or template score. Every answer gets a DIFFERENT score based on its specific content.`;
    const resp = await puter.ai.chat(prompt, {model:'gpt-4o-mini'});
    loading.classList.remove('show');
    let raw = typeof resp==='string' ? resp : resp?.message?.content || JSON.stringify(resp);
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('No JSON in response');
    const j = JSON.parse(match[0]);
    const passed = j.pass || j.score >= 70;
    const score = j.score || 0;

    // Render feedback
    const fbArea = document.getElementById('fb-area');
    fbArea.innerHTML = `<div class="fb-card ${passed?'pass':'fail'}">
      <div class="fb-top">
        <div>
          <div class="fb-score ${passed?'pass':'fail'}">${score}</div>
          <div class="fb-score-lbl">out of 100</div>
        </div>
        <div style="flex:1">
          <div class="fb-verdict">${passed?'&#9989; Good answer!':'&#10060; Needs improvement'}</div>
          ${j.summary ? `<div class="fb-summary">${j.summary}</div>` : ''}
        </div>
      </div>
      <div class="fb-sections">
        ${j.good?.[0] ? `<div class="fb-section">
          <div class="fb-section-lbl"><span class="mi fill sm" style="color:var(--green)">check_circle</span>What worked</div>
          <div class="fb-section-text">${j.good[0]}</div>
        </div>` : ''}
        ${j.improve?.[0] ? `<div class="fb-section">
          <div class="fb-section-lbl"><span class="mi fill sm" style="color:var(--amber)">tips_and_updates</span>Improve this</div>
          <div class="fb-section-text">${j.improve[0]}</div>
        </div>` : ''}
        <div style="display:flex;gap:var(--s3);margin-top:var(--s2)">
          ${currentIdx < getQueue().length-1
            ? `<button class="btn red" style="flex:1" onclick="showQ(${currentIdx+1})">
                <span class="mi fill sm">arrow_forward</span> Next Question
               </button>`
            : `<button class="btn red" style="flex:1" onclick="location.href='yorkstjohn-hub.html'">
                <span class="mi fill sm">check_circle</span> Back to Dashboard
               </button>`}
          <button class="btn outline" onclick="retryQ()" aria-label="Try this question again">
            <span class="mi sm">refresh</span> Retry
          </button>
        </div>
      </div>
    </div>`;

    // XP + Save
    if (typeof window.saveAIResponse === 'function') {
      const normScore = Math.round(score/10);
      await window.saveAIResponse('YSJ_'+q.id, ans, normScore, j.summary||'', q.q);
      const xp = parseInt(localStorage.getItem('ysj_xp')||'0') + (passed?20:10);
      localStorage.setItem('ysj_xp', xp);
    }
    // Streak
    const today = new Date().toDateString();
    if (localStorage.getItem('ysj_streak_date')!==today) {
      const streak = parseInt(localStorage.getItem('ysj_streak')||'0')+1;
      localStorage.setItem('ysj_streak', streak);
      localStorage.setItem('ysj_streak_date', today);
    }
    fbArea.scrollIntoView({behavior:'smooth',block:'start'});

  } catch(e) {
    loading.classList.remove('show');
    checkBtn.disabled = false;
    document.getElementById('fb-area').innerHTML = `<div class="card" style="padding:var(--s5);text-align:center">
      <span class="mi xl" style="color:var(--t4);display:block;margin-bottom:var(--s3)">wifi_off</span>
      <p style="font-size:14px;font-weight:700;color:var(--t2)">Could not connect to AI</p>
      <p style="font-size:13px;color:var(--t3);margin-top:4px">Make sure you are signed in to Puter and have internet access.</p>
    </div>`;
  }
}

function retryQ() {
  document.getElementById('fb-area').innerHTML='';
  document.getElementById('q-ans').value='';
  document.getElementById('char-count').textContent='0 characters';
  const checkBtn = document.getElementById('check-btn');
  if (checkBtn) checkBtn.disabled=false;
}

document.addEventListener('DOMContentLoaded', () => { showQ(0); });
</script>

<script>
// Scroll-aware topbar shadow
window.addEventListener('scroll', () => {
  const tb = document.querySelector('.topbar,.ysj-topbar');
  if (tb) tb.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });
</script>
