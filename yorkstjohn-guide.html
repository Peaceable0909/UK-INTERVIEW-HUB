<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/UK-INTERVIEW-HUB/">
<title>Interview Guide | York St John</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c41230;--red-dk:#9e0e25;--red-lt:#fff5f5;
  --navy:#1a1a2e;--surface:#fff;--bg:#f5f5f7;
  --border:#e5e7eb;--divider:#f3f4f6;
  --t1:#1d1d1f;--t2:#374151;--t3:#6e6e73;--t4:#aeaeb2;
  --green:#1c7c54;--green-lt:#d1fae5;--amber:#b45309;--amber-bg:#fffbeb;
  --s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:99px;
  --topbar:56px;--bottomnav:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.mi{font-family:"Material Symbols Outlined";
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  vertical-align:middle;line-height:1;user-select:none;}
.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
a{text-decoration:none;color:inherit;}

/* TOP BAR */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:calc(var(--topbar) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:4px;
  padding-left:4px;padding-right:var(--s4);
}
.tb-back{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);-webkit-tap-highlight-color:transparent;}
.tb-back:active{background:var(--divider);}
.tb-title{font-size:17px;font-weight:700;color:var(--t1);flex:1;}
.tb-action{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.tb-action:active{background:var(--divider);}

/* PROGRESS STRIP */
.prog-strip{
  position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top));z-index:90;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px var(--s4) var(--s3);
}
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.prog-lbl{font-size:13px;font-weight:700;color:var(--t2);}
.prog-pct{font-size:14px;font-weight:800;color:var(--green);}
.prog-track{height:6px;background:var(--divider);border-radius:var(--r-pill);overflow:hidden;}
.prog-fill{height:100%;border-radius:var(--r-pill);background:var(--green);transition:width .4s;}

/* PAGE BODY */
.page{
  padding-top:calc(var(--topbar) + env(safe-area-inset-top) + 54px);
  padding-bottom:calc(var(--bottomnav) + env(safe-area-inset-bottom) + 16px);
  padding-left:var(--s4);padding-right:var(--s4);
}

/* COURSE DETAIL CARD */
.course-card{
  background:var(--surface);border-radius:var(--r-xl);
  border:1px solid var(--border);padding:var(--s5);
  margin-bottom:var(--s5);
}
.course-card-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);}
.course-icon{width:40px;height:40px;border-radius:var(--r-md);background:var(--red-lt);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.course-icon .mi{font-size:22px;color:var(--red);}
.course-tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);}
.course-name{font-size:16px;font-weight:800;color:var(--t1);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s4);}
.stat-cell{background:var(--bg);border-radius:var(--r-md);padding:var(--s3) var(--s4);}
.stat-val{font-size:15px;font-weight:800;color:var(--t1);line-height:1;}
.stat-lbl{font-size:11px;color:var(--t3);margin-top:3px;}
.detail-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:6px;}
.detail-value{font-size:14px;color:var(--t2);background:var(--bg);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s4);line-height:1.5;}
.module-item{display:flex;align-items:flex-start;gap:var(--s3);background:var(--bg);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s2);}
.mod-num{width:24px;height:24px;border-radius:6px;background:var(--navy);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.mod-name{font-size:13px;font-weight:700;color:var(--t1);}
.mod-why{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.4;}
.role-chips{display:flex;flex-wrap:wrap;gap:var(--s2);}
.role-chip{background:var(--navy);color:#fff;border-radius:var(--r-pill);padding:5px 12px;font-size:12px;font-weight:700;}
.res-link{display:flex;align-items:center;gap:var(--s3);background:var(--bg);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s2);text-decoration:none;-webkit-tap-highlight-color:transparent;}
.res-link:active{background:var(--divider);}
.res-link .mi{font-size:18px;color:var(--red);flex-shrink:0;}
.res-link-lbl{flex:1;font-size:13px;font-weight:600;color:var(--t1);}
.res-link .arr{font-size:14px;color:var(--t4);}

/* ACCORDION CARDS */
.acc{background:var(--surface);border-radius:var(--r-lg);border:1.5px solid var(--border);margin-bottom:var(--s3);overflow:hidden;transition:border-color .2s;}
.acc.read{border-color:var(--green);}
.acc-header{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s4) var(--s4) var(--s3);cursor:pointer;min-height:64px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.acc-header:active{background:var(--divider);}
.acc-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;background:var(--divider);color:var(--t3);transition:all .2s;}
.acc.read .acc-num{background:var(--green);color:#fff;}
.acc-titles{flex:1;}
.acc-title{font-size:15px;font-weight:700;color:var(--t1);line-height:1.3;}
.acc-sub{font-size:12px;color:var(--t3);margin-top:2px;}
.acc-chev{color:var(--t4);flex-shrink:0;transition:transform .25s;font-size:22px;}
.acc.open .acc-chev{transform:rotate(180deg);}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);}
.acc.open .acc-body{max-height:2400px;}
.acc-content{padding:0 var(--s4) var(--s5);border-top:1px solid var(--divider);font-size:14px;color:var(--t2);line-height:1.65;}
.acc-content p{margin-bottom:var(--s3);}
.acc-content ul{padding-left:var(--s5);margin-bottom:var(--s3);}
.acc-content li{margin-bottom:var(--s2);}
.acc-content strong{color:var(--t1);}
.tip-box{background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:var(--s3) var(--s4);margin:var(--s3) 0;font-size:13px;}
.warn-box{background:var(--red-lt);border-left:3px solid var(--red);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:var(--s3) var(--s4);margin:var(--s3) 0;font-size:13px;}
.res-section{margin-top:var(--s4);}
.res-sec-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:var(--s2);}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(var(--bottomnav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 6px;
  color:var(--t4);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  text-decoration:none;-webkit-tap-highlight-color:transparent;}
.bn .mi{font-size:24px;}
.bn.active{color:var(--red);}
.bn.active .mi{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24;}

#toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 20px;border-radius:var(--r-pill);
  font-size:14px;font-weight:600;z-index:9999;white-space:nowrap;}

@media(min-width:640px){.page,.topbar,.bottomnav,.prog-strip{max-width:560px;left:50%;transform:translateX(-50%);right:auto;width:100%;}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

<header class="topbar">
  <a href="yorkstjohn-hub.html" class="tb-back" aria-label="Back">
    <span class="mi" style="font-size:22px">arrow_back_ios_new</span>
  </a>
  <span class="tb-title">Interview Guide</span>

<div class="prog-strip">

<script>
// ── ALL JS IN ONE SCRIPT BLOCK ──────────────────────────────────

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

// ── GUIDE RESOURCES PER SECTION ─────────────────────────────────
const GUIDE_RESOURCES = {
  0: [
    {icon:'link', label:'UKVI Credibility Interview Info', href:'https://www.gov.uk/student-visa'},
    {icon:'link', label:'YSJ International Students', href:'https://www.yorksj.ac.uk/international/'},
  ],
  1: [
    {icon:'link', label:'British Council — Study in the UK', href:'https://www.britishcouncil.org/study-work-abroad/in-uk'},
    {icon:'link', label:'UKCISA — Visa & Immigration Advice', href:'https://www.ukcisa.org.uk/student-advice/visas-and-immigration'},
  ],
  2: [
    {icon:'school', label:'About York St John University', href:'https://www.yorksj.ac.uk/about/'},
    {icon:'link',   label:'All YSJ Courses', href:'https://www.yorksj.ac.uk/courses/'},
    {icon:'link',   label:'YSJ Programme Specifications', href:'https://www.yorksj.ac.uk/programme-specifications/'},
  ],
  3: [
    {icon:'link', label:'YSJ Programme Specifications', href:'https://www.yorksj.ac.uk/programme-specifications/'},
    {icon:'link', label:'Search All YSJ Courses', href:'https://www.yorksj.ac.uk/courses/'},
  ],
  4: [
    {icon:'payments', label:'YSJ Tuition Fees & Scholarships', href:'https://www.yorksj.ac.uk/international/funding-scholarships-and-paying-tuition-fees/'},
    {icon:'link',     label:'UKVI Maintenance Requirements', href:'https://www.gov.uk/student-visa/money'},
  ],
  5: [
    {icon:'home', label:'YSJ York Campus Accommodation', href:'https://www.yorksj.ac.uk/study/accommodation/'},
    {icon:'apartment', label:'YSJ London Campus Accommodation', href:'https://www.yorksj.ac.uk/london-campus/welcome/before-you-start-at-our-london-campus/'},
  ],
  6: [
    {icon:'badge', label:'Graduate Route Visa (2 years after graduation)', href:'https://www.gov.uk/graduate-visa'},
    {icon:'link',  label:'Gov UK — Working in the UK After Study', href:'https://www.gov.uk/guidance/international-students-in-the-uk'},
  ],
  7: [
    {icon:'link', label:'UKCISA — Prior Study Guidance', href:'https://www.ukcisa.org.uk/student-advice/'},
  ],
  8: [
    {icon:'badge', label:'Student Visa Requirements', href:'https://www.gov.uk/student-visa'},
    {icon:'badge', label:'Graduate Route Visa', href:'https://www.gov.uk/graduate-visa'},
    {icon:'link',  label:'UKCISA Visa & Immigration Advice', href:'https://www.ukcisa.org.uk/student-advice/visas-and-immigration'},
  ],
};

// ── PROGRESS ─────────────────────────────────────────────────────
const readSet = new Set(JSON.parse(localStorage.getItem('ysj_guide_read') || '[]'));

function updateProgress() {
  const n = readSet.size, t = GUIDE_SECTIONS ? GUIDE_SECTIONS.length : 11;
  const pct = Math.round(n / t * 100);
  const lbl = document.getElementById('prog-lbl');
  const pctEl = document.getElementById('prog-pct');
  const fill = document.getElementById('prog-fill');
  if (lbl) lbl.textContent = n + ' of ' + t + ' sections read';
  if (pctEl) pctEl.textContent = pct + '%';
  if (fill) fill.style.width = pct + '%';
  localStorage.setItem('ysj_guide_opened', n);
}

function markAllRead() {
  if (!GUIDE_SECTIONS) return;
  GUIDE_SECTIONS.forEach(s => readSet.add(s.id));
  localStorage.setItem('ysj_guide_read', JSON.stringify([...readSet]));
  updateProgress();
  document.querySelectorAll('.acc').forEach(c => c.classList.add('read'));
  document.querySelectorAll('.acc-num').forEach(el => {
    el.innerHTML = '<span class="mi fill" style="font-size:15px;color:#fff">check</span>';
    el.style.background = 'var(--green)';
  });
  showToast('All sections marked as read ✅');
}

// ── ACCORDION ────────────────────────────────────────────────────
let openIdx = null;

function toggleAcc(idx) {
  const wasOpen = openIdx === idx;
  document.querySelectorAll('.acc').forEach(c => c.classList.remove('open'));
  openIdx = wasOpen ? null : idx;
  if (openIdx !== null) {
    const card = document.getElementById('acc-' + openIdx);
    if (card) {
      card.classList.add('open');
      // Mark as read
      if (GUIDE_SECTIONS) {
        const sec = GUIDE_SECTIONS[openIdx];
        if (sec && !readSet.has(sec.id)) {
          readSet.add(sec.id);
          localStorage.setItem('ysj_guide_read', JSON.stringify([...readSet]));
          card.classList.add('read');
          const num = card.querySelector('.acc-num');
          if (num) {
            num.innerHTML = '<span class="mi fill" style="font-size:15px;color:#fff">check</span>';
            num.style.background = 'var(--green)';
          }
          updateProgress();
          // Award XP
          const xp = parseInt(localStorage.getItem('ysj_xp') || '0') + 3;
          localStorage.setItem('ysj_xp', xp);
        }
      }
      setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
    }
  }
}

// ── COURSE DETAIL RENDERER ───────────────────────────────────────
function renderCourseDetail() {
  const cid = localStorage.getItem('last_course');
  if (!cid || !COURSES || !COURSES[cid]) return;
  const c = COURSES[cid];
  const sec = document.getElementById('course-detail');
  if (sec) sec.style.display = 'block';
  const nameEl = document.getElementById('cd-name');
  if (nameEl) nameEl.textContent = c.name;
  const stats = document.getElementById('cd-stats');
  if (stats) stats.innerHTML = [
    { v: c.tuition || '—', l: 'Per year tuition' },
    { v: c.livingCost || '—', l: 'UKVI living cost' },
    { v: c.accommodation || '—', l: 'Accommodation/wk' },
    { v: c.salary || '—', l: 'Graduate salary' },
  ].map(s => `<div class="stat-cell"><div class="stat-val">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join('');
  const addr = document.getElementById('cd-address');
  if (addr) addr.textContent = c.address || c.city || '';
  const assess = document.getElementById('cd-assess');
  if (assess) assess.textContent = c.assessment || 'Coursework and examinations.';
  const mods = document.getElementById('cd-mods');
  if (mods) {
    if (c.modules && c.modules.length) {
      mods.innerHTML = c.modules.map((m, i) => `<div class="module-item"><div class="mod-num">${i + 1}</div><div><div class="mod-name">${m.name}</div>${m.why ? '<div class="mod-why">' + m.why + '</div>' : ''}</div></div>`).join('');
    } else {
      const w = document.getElementById('cd-mods-wrap');
      if (w) w.style.display = 'none';
    }
  }
  const roles = document.getElementById('cd-roles');
  if (roles) {
    if (c.roles && c.roles.length) {
      roles.innerHTML = c.roles.map(r => `<span class="role-chip">${r}</span>`).join('');
    } else {
      const w = document.getElementById('cd-roles-wrap');
      if (w) w.style.display = 'none';
    }
  }
  const isLondon = c.city === 'London';
  const links = [
    { icon: 'open_in_new', label: 'Programme Specification', href: c.specUrl || 'https://www.yorksj.ac.uk/programme-specifications/' },
    { icon: 'apartment',   label: 'Campus Information', href: c.campusUrl || 'https://www.yorksj.ac.uk/campus-and-facilities/' },
    { icon: 'payments',    label: 'Tuition Fees & Funding', href: 'https://www.yorksj.ac.uk/international/funding-scholarships-and-paying-tuition-fees/' },
    { icon: 'home', label: isLondon ? 'London Accommodation' : 'York Accommodation',
      href: isLondon ? 'https://www.yorksj.ac.uk/london-campus/welcome/before-you-start-at-our-london-campus/' : 'https://www.yorksj.ac.uk/study/accommodation/' },
    { icon: 'badge', label: 'Student Visa Requirements', href: 'https://www.gov.uk/student-visa' },
    { icon: 'badge', label: 'Graduate Route Visa', href: 'https://www.gov.uk/graduate-visa' },
    { icon: 'link',  label: 'UKCISA Visa & Immigration Advice', href: 'https://www.ukcisa.org.uk/student-advice/visas-and-immigration' },
  ];
  const lnks = document.getElementById('cd-links');
  if (lnks) lnks.innerHTML = links.map(l => `<a href="${l.href}" target="_blank" rel="noopener" class="res-link"><span class="mi fill" style="font-size:18px;color:var(--red)">${l.icon}</span><span class="res-link-lbl">${l.label}</span><span class="mi arr">open_in_new</span></a>`).join('');
}

// ── RENDER GUIDE SECTIONS ────────────────────────────────────────
function renderGuide() {
  if (!GUIDE_SECTIONS) return;
  const list = document.getElementById('guide-list');
  if (!list) return;
  list.innerHTML = GUIDE_SECTIONS.map((s, i) => {
    const isRead = readSet.has(s.id);
    const res = (GUIDE_RESOURCES[i] || []).map(r => `<a href="${r.href}" target="_blank" rel="noopener" class="res-link"><span class="mi fill" style="font-size:18px;color:var(--red)">${r.icon}</span><span class="res-link-lbl">${r.label}</span><span class="mi arr">open_in_new</span></a>`).join('');
    const numContent = isRead ? '<span class="mi fill" style="font-size:15px;color:#fff">check</span>' : s.num;
    const numStyle = isRead ? 'background:var(--green);' : '';
    return `<div class="acc${isRead ? ' read' : ''}" id="acc-${i}">
      <div class="acc-header" onclick="toggleAcc(${i})" role="button" aria-expanded="false">
        <div class="acc-num" style="${numStyle}">${numContent}</div>
        <div class="acc-titles">
          <div class="acc-title">${s.title}</div>
          ${s.sub ? '<div class="acc-sub">' + s.sub + '</div>' : ''}
        </div>
        <span class="mi acc-chev">expand_more</span>
      </div>
      <div class="acc-body">
        <div class="acc-content">
          ${s.content || ''}
          ${res ? '<div class="res-section"><div class="res-sec-lbl">Official Resources</div>' + res + '</div>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── INIT ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderCourseDetail();
  renderGuide();
  updateProgress();
});
</script>
</body>
</html>
