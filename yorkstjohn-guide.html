<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/UK-INTERVIEW-HUB/">
<title>Interview Guide | YSJ Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
:root{--red:#c41230;--navy:#1a1a2e;--surface:#fff;--bg:#f0f2f5;--border:#e5e7eb;--txt:#111827;--muted:#6b7280;--green:#16a34a;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased;}
.mat{font-family:"Material Symbols Outlined";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:middle;line-height:1;}
.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24;}
.top-bar{position:fixed;top:0;left:0;right:0;height:56px;height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding-left:8px;padding-right:16px;gap:8px;z-index:100;}
.back-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.back-btn .mat{font-size:22px;color:var(--navy);}
.top-title{font-size:16px;font-weight:800;color:var(--navy);flex:1;}
.page-body{padding-top:calc(56px + env(safe-area-inset-top) + 16px);padding-bottom:calc(68px + env(safe-area-inset-bottom));padding-left:16px;padding-right:16px;}
.progress-bar{height:4px;background:#f3f4f6;border-radius:99px;margin-bottom:20px;overflow:hidden;}
.progress-fill{height:100%;background:var(--red);border-radius:99px;transition:width .4s;}
.section-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.guide-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden;-webkit-tap-highlight-color:transparent;}
.guide-header{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;min-height:60px;}
.guide-num{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.guide-num.done{background:var(--green);}
.guide-title-wrap{flex:1;}
.guide-title{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3;}
.guide-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.guide-chevron{color:var(--muted);transition:transform .2s;}
.guide-chevron.open{transform:rotate(180deg);}
.guide-body{display:none;padding:0 16px 16px;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);}
.guide-body.open{display:block;}
.guide-body ul{padding-left:18px;margin-top:8px;}
.guide-body li{margin-bottom:6px;}
.guide-body strong{color:var(--navy);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid var(--border);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(5,1fr);}
.nav-tab{display:flex;flex-direction:column;align-items:center;padding:10px 4px;text-decoration:none;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;gap:3px;}
.nav-tab.active{color:var(--red);}
.nav-tab .mat{font-size:22px;}
.nav-tab.active .mat{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24;}
</style>
</head>
<body>
<header class="top-bar">
  <a href="yorkstjohn-hub.html" class="back-btn" aria-label="Back to dashboard"><span class="mat">arrow_back_ios_new</span></a>
  <h1 class="top-title">Interview Guide</h1>
  <button style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;" onclick="markAllRead()">
    <span class="mat" style="font-size:20px;color:var(--green)">done_all</span>
  </button>
</header>

<div class="page-body">
  <div class="progress-bar"><div class="progress-fill" id="guide-progress" style="width:0%"></div></div>
  <p class="section-label" id="guide-progress-label">0 of 11 sections read</p>
  <div id="guideList"><!-- Rendered by JS --></div>
</div>

<nav class="bottom-nav">
  <a href="yorkstjohn-hub.html" class="nav-tab"><span class="mat">home</span>Home</a>
  <a href="yorkstjohn-guide.html" class="nav-tab active"><span class="mat">menu_book</span>Guide</a>
  <a href="yorkstjohn-practice.html" class="nav-tab"><span class="mat">mic</span>Practice</a>
  <a href="yorkstjohn-questions.html" class="nav-tab"><span class="mat">quiz</span>Questions</a>
  <a href="yorkstjohn-checklist.html" class="nav-tab"><span class="mat">checklist</span>Checklist</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=3"></script>
<script src="yorkstjohn-data.js"></script>
<script>
let openCount = parseInt(localStorage.getItem('ysj_guide_opened')||'0');
const readSet = new Set(JSON.parse(localStorage.getItem('ysj_guide_read')||'[]'));

function updateProgress(){
  const pct = Math.round(readSet.size/GUIDE_SECTIONS.length*100);
  document.getElementById('guide-progress').style.width=pct+'%';
  document.getElementById('guide-progress-label').textContent=readSet.size+' of '+GUIDE_SECTIONS.length+' sections read';
}

function markAllRead(){
  GUIDE_SECTIONS.forEach(s=>readSet.add(s.id));
  localStorage.setItem('ysj_guide_read',JSON.stringify([...readSet]));
  localStorage.setItem('ysj_guide_opened',GUIDE_SECTIONS.length);
  updateProgress();
  document.querySelectorAll('.guide-num').forEach(el=>el.classList.add('done'));
}

function toggleSection(id){
  const body=document.getElementById('body-'+id);
  const chevron=document.getElementById('chev-'+id);
  const num=document.getElementById('num-'+id);
  const isOpen=body.classList.contains('open');
  // Close all
  document.querySelectorAll('.guide-body').forEach(b=>b.classList.remove('open'));
  document.querySelectorAll('.guide-chevron').forEach(c=>c.classList.remove('open'));
  if(!isOpen){
    body.classList.add('open');
    chevron.classList.add('open');
    // Mark as read
    if(!readSet.has(id)){
      readSet.add(id);
      num.classList.add('done');
      openCount=Math.min(GUIDE_SECTIONS.length,openCount+1);
      localStorage.setItem('ysj_guide_opened',openCount);
      localStorage.setItem('ysj_guide_read',JSON.stringify([...readSet]));
      updateProgress();
    }
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  const list=document.getElementById('guideList');
  list.innerHTML=GUIDE_SECTIONS.map(s=>{
    const done=readSet.has(s.id);
    return `<div class="guide-card">
      <div class="guide-header" onclick="toggleSection('${s.id}')" aria-expanded="false">
        <div class="guide-num${done?' done':''}" id="num-${s.id}">${s.num}</div>
        <div class="guide-title-wrap">
          <div class="guide-title">${s.title}</div>
          <div class="guide-sub">${s.sub}</div>
        </div>
        <span class="mat guide-chevron" id="chev-${s.id}">expand_more</span>
      </div>
      <div class="guide-body" id="body-${s.id}">${s.content}</div>
    </div>`;
  }).join('');
  updateProgress();
});
</script>
</body>
</html>
