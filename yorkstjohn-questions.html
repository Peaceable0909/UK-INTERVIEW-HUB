<style>
/* ═══════════════════════════════════════════════════════════
   WhiteRock × York St John — Design System v2
   UI/UX Pro Max: 8dp grid · 44px targets · system fonts
   Style: Clean flat + subtle depth (EdTech / Apple-like)
═══════════════════════════════════════════════════════════ */
:root{
  /* Brand */
  --red:#c41230; --red-dk:#9e0e25; --red-lt:#fff5f5; --red-mid:#fecaca;
  --navy:#1a1a2e; --navy2:#0f172a;
  /* Neutrals */
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#fafafa;
  --border:#e5e7eb; --divider:#f3f4f6;
  /* Text */
  --t1:#1d1d1f; --t2:#3c3c43; --t3:#6e6e73; --t4:#aeaeb2;
  /* Semantic */
  --green:#1c7c54; --green-lt:#d1fae5; --green-bg:#f0fdf4;
  --amber:#b45309; --amber-lt:#fef3c7; --amber-bg:#fffbeb;
  --blue:#1d4ed8; --blue-lt:#dbeafe; --blue-bg:#eff6ff;
  --purple:#5b21b6; --purple-lt:#ede9fe; --purple-bg:#faf5ff;
  --teal:#0d7377; --teal-lt:#ccfbf1; --teal-bg:#f0fdfa;
  /* Spacing (8dp) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:28px; --s8:32px; --s10:40px; --s12:48px;
  /* Radii */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:99px;
  /* Elevation */
  --sh-1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-2:0 4px 12px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
  --sh-3:0 12px 32px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.06);
  /* Layout */
  --topbar:56px; --bottomnav:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--t1);line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* Material Symbols */
.mi{
  font-family:"Material Symbols Outlined";
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  vertical-align:middle;line-height:1;user-select:none;
  font-size:22px; /* prevents shift */
}
.mi.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24;}
.mi.sm{font-size:18px;}
.mi.xs{font-size:16px;}
.mi.lg{font-size:26px;}
.mi.xl{font-size:32px;}
/* Headings */
h1{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.15;letter-spacing:-.3px;color:var(--t1);}
h2{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.2px;color:var(--t1);}
h3{font-size:16px;font-weight:700;line-height:1.3;color:var(--t1);}
p{color:var(--t3);line-height:1.5;}
/* Links */
a{text-decoration:none;color:inherit;}
/* Buttons */
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:16px;}
button:disabled{opacity:.5;cursor:not-allowed;}
/* ── TOP BAR ─────────────────────────────────────────── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:calc(var(--topbar) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding-left:var(--s2);padding-right:var(--s4);gap:var(--s2);
}
.topbar-back{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--navy);-webkit-tap-highlight-color:transparent;
  transition:background .15s;flex-shrink:0;
}
.topbar-back:hover,.topbar-back:active{background:var(--divider);}
.topbar-title{font-size:17px;font-weight:700;color:var(--t1);flex:1;letter-spacing:-.2px;}
.topbar-action{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.topbar-action:hover,.topbar-action:active{background:var(--divider);}
.topbar-badge-wrap{position:relative;}
.notif-badge{
  position:absolute;top:6px;right:6px;
  width:8px;height:8px;border-radius:50%;
  background:var(--red);border:2px solid #fff;
  display:none;
}
.notif-badge.on{display:block;}
/* ── PAGE BODY ───────────────────────────────────────── */
.page{
  padding-top:calc(var(--topbar) + env(safe-area-inset-top) + var(--s4));
  padding-bottom:calc(var(--bottomnav) + env(safe-area-inset-bottom) + var(--s6));
}
.pad{padding-left:var(--s4);padding-right:var(--s4);}
/* ── BOTTOM NAV ──────────────────────────────────────── */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:calc(var(--bottomnav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);
  align-items:start;
}
.bn-tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px var(--s2) 6px;
  color:var(--t4);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
  transition:color .15s;
}
.bn-tab .mi{font-size:24px;transition:all .15s;}
.bn-tab.active{color:var(--red);}
.bn-tab.active .mi{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24;}
/* ── CARD ────────────────────────────────────────────── */
.card{
  background:var(--surface);border-radius:var(--r-xl);
  border:1px solid var(--border);overflow:hidden;
}
.card+.card{margin-top:var(--s3);}
/* ── SECTION HEADER ──────────────────────────────────── */
.sec-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--s4);
}
.sec-title{font-size:18px;font-weight:800;color:var(--t1);letter-spacing:-.2px;}
.sec-sub{font-size:13px;color:var(--t3);margin-top:2px;}
.sec-link{
  font-size:13px;font-weight:700;color:var(--red);
  display:flex;align-items:center;gap:2px;
}
/* ── BUTTONS ─────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:var(--s2);border-radius:var(--r-md);font-weight:700;
  min-height:44px;padding:0 var(--s5);font-size:15px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:filter .15s, opacity .15s;
  touch-action:manipulation;
}
.btn:active{filter:brightness(.93);}
.btn.full{width:100%;}
.btn.red{background:var(--red);color:#fff;}
.btn.navy{background:var(--navy);color:#fff;}
.btn.outline{border:1.5px solid var(--border);background:var(--surface);color:var(--t1);}
.btn.ghost{background:transparent;color:var(--red);border:none;}
.btn.lg{min-height:52px;font-size:16px;border-radius:14px;}
/* ── CHIPS / BADGES ──────────────────────────────────── */
.chip{
  display:inline-flex;align-items:center;gap:var(--s1);
  border-radius:var(--r-pill);padding:5px 12px;
  font-size:12px;font-weight:700;
}
.chip.red{background:var(--red-lt);color:var(--red);}
.chip.green{background:var(--green-lt);color:var(--green);}
.chip.navy{background:#e8eaf2;color:var(--navy);}
.chip.muted{background:var(--divider);color:var(--t3);}
.chip.border{background:var(--surface);border:1.5px solid var(--border);color:var(--t2);}
/* ── INPUT ───────────────────────────────────────────── */
.input{
  width:100%;border:1.5px solid var(--border);
  border-radius:var(--r-md);padding:12px 14px;
  font-size:16px;font-family:inherit;
  outline:none;background:var(--surface);
  transition:border-color .15s;color:var(--t1);
}
.input:focus{border-color:var(--red);}
.textarea{resize:none;min-height:120px;line-height:1.5;}
/* ── DIVIDER ─────────────────────────────────────────── */
.hr{height:1px;background:var(--divider);margin:var(--s4) 0;}
/* ── SHIMMER SKELETON ────────────────────────────────── */
.skeleton{
  background:linear-gradient(90deg,var(--divider) 25%,#ebebeb 50%,var(--divider) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:var(--r-sm);
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* ── SPINNER ─────────────────────────────────────────── */
.spinner{
  width:20px;height:20px;
  border:2.5px solid var(--divider);
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:inline-block;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg);}}
/* ── TOAST ───────────────────────────────────────────── */
#toast{
  display:none;position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%);
  background:var(--t1);color:#fff;
  padding:10px 20px;border-radius:var(--r-pill);
  font-size:14px;font-weight:600;z-index:9999;
  box-shadow:var(--sh-3);white-space:nowrap;
}
/* ── PROGRESS BAR ────────────────────────────────────── */
.prog-track{
  height:6px;background:var(--divider);
  border-radius:var(--r-pill);overflow:hidden;
}
.prog-fill{
  height:100%;border-radius:var(--r-pill);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
/* ── SAFE AREAS ──────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
/* ── RESPONSIVE ──────────────────────────────────────── */
@media(min-width:768px){
  .page{max-width:560px;margin:0 auto;}
  .topbar{max-width:560px;left:50%;transform:translateX(-50%);}
  .bottomnav{max-width:560px;left:50%;transform:translateX(-50%);}
}
</style>
<style>
.cat-sticky{
  position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top));z-index:90;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:var(--s3) 0 0;
}
.cat-scroll{
  display:flex;gap:var(--s2);padding:0 var(--s4) var(--s3);
  overflow-x:auto;scrollbar-width:none;
}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{
  flex-shrink:0;padding:7px 16px;border-radius:var(--r-pill);
  border:1.5px solid var(--border);background:var(--surface);
  font-size:13px;font-weight:700;color:var(--t3);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:all .15s;white-space:nowrap;
}
.cat-chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
/* Category section */
.cat-section{margin-bottom:var(--s6);}
.cat-hdr{
  display:flex;align-items:center;gap:var(--s3);
  margin-bottom:var(--s3);padding-bottom:var(--s2);
  border-bottom:2px solid var(--divider);
}
.cat-icon{
  width:32px;height:32px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cat-icon .mi{font-size:18px;}
.cat-name{font-size:15px;font-weight:800;color:var(--t1);}
/* Question accordion item */
.q-acc{
  background:var(--surface);border-radius:var(--r-lg);
  border:1px solid var(--border);margin-bottom:var(--s2);
  overflow:hidden;transition:border-color .2s;
}
.q-acc.open{border-color:var(--red);}
.q-header{
  display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s4);cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  min-height:52px;
}
.q-header:active{background:var(--bg);}
.q-indicator{
  width:4px;border-radius:2px;min-height:20px;
  background:var(--divider);margin-top:2px;flex-shrink:0;
  transition:background .2s;
}
.q-acc.open .q-indicator{background:var(--red);}
.q-header-text{flex:1;}
.q-text{font-size:14px;font-weight:600;color:var(--t1);line-height:1.45;}
.q-chevron{color:var(--t4);flex-shrink:0;margin-top:1px;transition:transform .25s;}
.q-acc.open .q-chevron{transform:rotate(180deg);}
/* Question body */
.q-body{
  max-height:0;overflow:hidden;
  transition:max-height .3s cubic-bezier(.4,0,.2,1);
}
.q-acc.open .q-body{max-height:800px;}
.q-body-inner{
  border-top:1px solid var(--divider);
  padding:var(--s4) var(--s4) var(--s5);
}
.q-criteria-label{font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--t3);margin-bottom:var(--s2);}
.q-criteria{
  font-size:13px;color:var(--t2);line-height:1.5;
  background:var(--bg);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);margin-bottom:var(--s4);
}
.q-hint-box{
  background:var(--amber-bg);border-left:3px solid var(--amber);
  border-radius:0 var(--r-md) var(--r-md) 0;
  padding:var(--s3) var(--s4);margin-bottom:var(--s4);
  font-size:13px;color:var(--t2);line-height:1.5;
}
.q-hint-label{font-size:11px;font-weight:800;color:var(--amber);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.q-practice-btn{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  width:100%;background:var(--red);color:#fff;border-radius:var(--r-md);
  padding:0 var(--s5);font-size:14px;font-weight:700;
  min-height:44px;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;transition:opacity .15s;
}
.q-practice-btn:active{opacity:.9;}
.q-practice-btn .mi{font-size:18px;}
</style>

<script>
const CAT_STYLES = {
  'Studying in the UK':           {icon:'public',   color:'#7c3aed',bg:'#ede9fe'},
  'Why York St John University':  {icon:'account_balance',color:'#0891b2',bg:'#ecfeff'},
  'Course Details & Modules':     {icon:'menu_book',color:'#d97706',bg:'#fefce8'},
  'Future Career Plans':          {icon:'trending_up',color:'#1c7c54',bg:'#d1fae5'},
  'Finance & Funding':            {icon:'payments', color:'#c41230',bg:'#fff5f5'},
  'Accommodation & Living':       {icon:'home',     color:'#0d7377',bg:'#ccfbf1'},
  'Prior UK Study':               {icon:'history_edu',color:'#5b21b6',bg:'#ede9fe'},
  'Education & Employment Gaps':  {icon:'work_history',color:'#ea580c',bg:'#ffedd5'},
  'Student Visa Knowledge':       {icon:'badge',    color:'#1d4ed8',bg:'#dbeafe'},
};

let openQ = null, activeCat = 'All';

// Build category chips
const scroll = document.getElementById('catScroll');
ALL_QUESTIONS.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-chip';
  btn.textContent = cat.cat;
  btn.onclick = () => filterCat(cat.cat, btn);
  scroll.appendChild(btn);
});

function filterCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  openQ = null;
  render();
}

function toggleQ(id) {
  openQ = openQ===id ? null : id;
  render();
  if (openQ!==null) {
    setTimeout(()=>document.getElementById('qacc-'+openQ)?.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
  }
}

function practiceQ(qText, cat) {
  sessionStorage.setItem('ysj_practice_q', JSON.stringify({q:qText,cat}));
  location.href = 'yorkstjohn-practice.html?from=qbank';
}

function render() {
  const body = document.getElementById('qBody');
  const cats = activeCat==='All' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(c=>c.cat===activeCat);
  body.innerHTML = cats.map(cat => {
    const s = CAT_STYLES[cat.cat] || {icon:'quiz',color:'#6b7280',bg:'#f3f4f6'};
    const items = cat.qs.map((q,i) => {
      const qid = cat.cat.replace(/[^a-z0-9]/gi,'_')+'_'+i;
      const isOpen = openQ===qid;
      return `<div class="q-acc${isOpen?' open':''}" id="qacc-${qid}">
        <div class="q-header" onclick="toggleQ('${qid}')"
          role="button" aria-expanded="${isOpen}" aria-label="${q}">
          <div class="q-indicator" aria-hidden="true"></div>
          <div class="q-header-text">
            <div class="q-text">${q}</div>
          </div>
          <span class="mi q-chevron sm" aria-hidden="true">expand_more</span>
        </div>
        <div class="q-body" role="region">
          <div class="q-body-inner">
            ${cat.cr ? `<div class="q-criteria-label">UKVI Expects</div>
            <div class="q-criteria">${cat.cr}</div>` : ''}
            <div class="q-hint-box">
              <div class="q-hint-label">&#128161; What to include</div>
              Give a specific example for every statement. Mention at least one comparison with another country or university. Use personal language — "I chose…" not "YSJ is…"
            </div>
            <button class="q-practice-btn"
              onclick="practiceQ(${JSON.stringify(q)}, '${cat.cat.replace(/'/g,"\'")}')"
              aria-label="Practise this question with AI">
              <span class="mi fill sm">mic</span>
              Practise This Question with AI
            </button>
          </div>
        </div>
      </div>`;
    }).join('');
    return `<div class="cat-section" id="sec-${cat.cat.toLowerCase().replace(/ /g,'-')}">
      <div class="cat-hdr">
        <div class="cat-icon" style="background:${s.bg}">
          <span class="mi fill" style="color:${s.color}" aria-hidden="true">${s.icon}</span>
        </div>
        <span class="cat-name">${cat.cat}</span>
        <span class="chip muted" style="margin-left:auto;font-size:11px">${cat.qs.length}</span>
      </div>
      ${items}
    </div>`;
  }).join('');

  // Handle hash from hub module links
  const hash = location.hash.replace('#','');
  if (hash && activeCat==='All') {
    const el = document.getElementById('sec-'+hash);
    if (el) setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),200);
  }
}

document.addEventListener('DOMContentLoaded', () => { render(); });
</script>

<script>
// Scroll-aware topbar shadow
window.addEventListener('scroll', () => {
  const tb = document.querySelector('.topbar,.ysj-topbar');
  if (tb) tb.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });
</script>
</body>
