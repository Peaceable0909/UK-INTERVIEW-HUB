<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/UK-INTERVIEW-HUB/">
<title>Question Bank | YSJ Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
:root{--red:#c41230;--navy:#1a1a2e;--surface:#fff;--bg:#f0f2f5;--border:#e5e7eb;--txt:#111827;--muted:#6b7280;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased;}
.mat{font-family:"Material Symbols Outlined";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:middle;line-height:1;}
.top-bar{position:fixed;top:0;left:0;right:0;height:56px;height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:env(safe-area-inset-top) 16px 0;padding-bottom:0;gap:8px;z-index:100;min-height:56px;}
.back-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;}
.back-btn .mat{font-size:22px;color:var(--navy);}
.top-title{font-size:16px;font-weight:800;color:var(--navy);flex:1;}
.cat-bar{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:90;background:var(--surface);border-bottom:1px solid var(--border);}
.cat-scroll{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{flex-shrink:0;padding:7px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.cat-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.page-body{padding-top:calc(56px + env(safe-area-inset-top) + 56px + 16px);padding-bottom:calc(68px + env(safe-area-inset-bottom));padding-left:16px;padding-right:16px;}
.cat-section{margin-bottom:24px;}
.cat-title{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.cat-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-icon .mat{font-size:15px;}
.q-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:10px;padding:14px 14px 14px 12px;margin-bottom:8px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.q-item:active{transform:scale(.99);}
.q-item:hover{border-left-color:var(--red);}
.q-text{font-size:13px;font-weight:600;color:var(--navy);line-height:1.4;}
.q-hint-preview{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid var(--border);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(5,1fr);}
.nav-tab{display:flex;flex-direction:column;align-items:center;padding:10px 4px;text-decoration:none;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;gap:3px;}
.nav-tab.active{color:var(--red);}
.nav-tab .mat{font-size:22px;}
.nav-tab.active .mat{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24;}
</style>
</head>
<body>
<header class="top-bar">
  <a href="yorkstjohn-hub.html" class="back-btn"><span class="mat">arrow_back_ios_new</span></a>
  <h1 class="top-title">Question Bank</h1>
</header>

<div class="cat-bar">
  <div class="cat-scroll" id="catScroll">
    <button class="cat-chip active" onclick="filterCat('All',this)">All</button>
  </div>
</div>

<div class="page-body" id="qBody"><!-- JS renders --></div>

<nav class="bottom-nav">
  <a href="yorkstjohn-hub.html" class="nav-tab"><span class="mat">home</span>Home</a>
  <a href="yorkstjohn-guide.html" class="nav-tab"><span class="mat">menu_book</span>Guide</a>
  <a href="yorkstjohn-practice.html" class="nav-tab"><span class="mat">mic</span>Practice</a>
  <a href="yorkstjohn-questions.html" class="nav-tab active"><span class="mat">quiz</span>Questions</a>
  <a href="yorkstjohn-checklist.html" class="nav-tab"><span class="mat">checklist</span>Checklist</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=3"></script>
<script src="yorkstjohn-data.js"></script>
<script>
const CAT_ICONS={
  'Studying in the UK':{icon:'public',color:'#7c3aed',bg:'#ede9fe'},
  'Why York St John University':{icon:'account_balance',color:'#0891b2',bg:'#ecfeff'},
  'Course Details & Modules':{icon:'menu_book',color:'#d97706',bg:'#fefce8'},
  'Future Career Plans':{icon:'trending_up',color:'#16a34a',bg:'#f0fdf4'},
  'Finance & Funding':{icon:'payments',color:'#dc2626',bg:'#fef2f2'},
  'Accommodation & Living':{icon:'home',color:'#0d9488',bg:'#f0fdf4'},
  'Prior UK Study':{icon:'history_edu',color:'#6366f1',bg:'#ede9fe'},
  'Education & Employment Gaps':{icon:'work_history',color:'#ea580c',bg:'#fff7ed'},
  'Student Visa Knowledge':{icon:'badge',color:'#1d4ed8',bg:'#eff6ff'},
};
let activeCat='All';

function filterCat(cat,btn){
  activeCat=cat;
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const body=document.getElementById('qBody');
  const cats=activeCat==='All'?ALL_QUESTIONS:ALL_QUESTIONS.filter(c=>c.cat===activeCat);
  body.innerHTML=cats.map(cat=>{
    const s=CAT_ICONS[cat.cat]||{icon:'quiz',color:'#6b7280',bg:'#f3f4f6'};
    return `<div class="cat-section">
      <div class="cat-title">
        <div class="cat-icon" style="background:${s.bg}"><span class="mat fill" style="color:${s.color}">${s.icon}</span></div>
        ${cat.cat}
      </div>
      ${cat.qs.map((q,i)=>`<div class="q-item" style="border-left-color:${s.color}" onclick="location.href='yorkstjohn-practice.html?q='+encodeURIComponent('${cat.cat}')">
        <div class="q-text">${q}</div>
      </div>`).join('')}
    </div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded',()=>{
  // Build cat chips
  const scroll=document.getElementById('catScroll');
  ALL_QUESTIONS.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-chip';
    btn.textContent=cat.cat;
    btn.onclick=()=>filterCat(cat.cat,btn);
    scroll.appendChild(btn);
  });
  // Handle hash
  const hash=location.hash.replace('#','');
  if(hash){
    const catMap={uk:'Studying in the UK',ysj:'Why York St John University',
      course:'Course Details & Modules',career:'Future Career Plans',
      finance:'Finance & Funding',living:'Accommodation & Living'};
    if(catMap[hash]){
      const cat=catMap[hash];
      const btn=[...document.querySelectorAll('.cat-chip')].find(b=>b.textContent===cat);
      if(btn) filterCat(cat,btn);
    }
  }
  render();
});
</script>
</body>
</html>
